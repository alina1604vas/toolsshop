name: CI

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Every "docker compose" call below uses the documented prod compose (PREBUILT images).
      COMPOSE_FILE: docker-compose.prod.yml

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---- Application under test, self-hosted so the tests never touch the public demo
      # ---- site (which sits behind Cloudflare and blocks CI IP ranges). ----
      - name: Check out application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: app-under-test

      - name: Start application under test (prebuilt images)
        working-directory: app-under-test
        run: |
          # Follows the project's documented quick start, but with docker-compose.prod.yml,
          # which uses PREBUILT images. That removes the "composer" service entirely - the
          # ~10 minute source install was the thing every previous readiness gate raced
          # against and lost to.
          printf 'SPRINT=sprint5\nDISABLE_LOGGING=false\n' > .env
          cat .env
          docker compose pull --quiet
          docker compose up -d
          docker compose ps

      - name: Wait until Laravel can boot
        working-directory: app-under-test
        run: |
          # Capability probe: "php artisan --version" boots the whole framework, so it proves
          # the app is usable - and it needs no DB tables, so it is the right precondition
          # for the migrate step below.
          API=$(docker compose ps -q laravel-api)
          for i in $(seq 1 60); do
            if out=$(docker exec "$API" php artisan --version 2>&1); then
              echo "Laravel booted: $out"
              exit 0
            fi
            echo "attempt $i: artisan not ready yet"
            sleep 5
          done
          echo "Laravel never booted. Diagnostics:"
          docker compose logs --tail=120 laravel-api
          exit 1

      - name: Stop cron (its invoice job crashes and only adds noise)
        working-directory: app-under-test
        run: docker compose stop cron || true

      - name: Prepare the database (documented migrate:fresh --seed)
        working-directory: app-under-test
        run: |
          API=$(docker compose ps -q laravel-api)
          for i in $(seq 1 12); do
            if docker exec "$API" php artisan migrate:fresh --seed --force; then
              echo "Database migrated and seeded."
              exit 0
            fi
            echo "attempt $i failed (MariaDB may still be starting), retrying in 10s..."
            sleep 10
          done
          echo "migrate:fresh --seed never succeeded. Diagnostics:"
          docker exec "$API" sh -c 'tail -n 120 storage/logs/laravel.log 2>/dev/null || true'
          docker compose logs --tail=120 mariadb laravel-api
          exit 1

      - name: Wait for the API to serve catalogue data
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/brands || echo 000)
            echo "attempt $i: GET :8091/brands -> $code"
            if [ "$code" = "200" ]; then
              echo "API is serving."
              exit 0
            fi
            sleep 5
          done
          echo "API never served 200. Diagnostics:"
          (cd app-under-test && docker compose ps && docker compose logs --tail=150 laravel-api web)
          exit 1

      - name: Wait for UI to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4200; then
              echo "UI is up at http://localhost:4200"
              exit 0
            fi
            echo "attempt $i: waiting for the Angular dev server"
            sleep 10
          done
          echo "UI never became ready. Diagnostics:"
          (cd app-under-test && docker compose logs --tail=80 angular-ui)
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:4200/
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FIRSTNAME: ${{ secrets.TEST_USER_FIRSTNAME }}
          TEST_USER_LASTNAME: ${{ secrets.TEST_USER_LASTNAME }}
          TEST_USER_STREET: ${{ secrets.TEST_USER_STREET }}
          TEST_USER_CITY: ${{ secrets.TEST_USER_CITY }}
          TEST_USER_COUNTRY: ${{ secrets.TEST_USER_COUNTRY }}
        run: ./gradlew clean test -PincludeTags=smoke -Dheadless=true --stacktrace

      - name: Dump app diagnostics on failure
        if: failure()
        working-directory: app-under-test
        run: |
          set +e
          docker compose ps
          echo "== GET :8091/brands =="
          curl -s -i http://localhost:8091/brands | head -n 30
          echo "== laravel.log =="
          API=$(docker compose ps -q laravel-api)
          docker exec "$API" sh -c 'tail -n 150 storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"'
          echo "== container logs =="
          docker compose logs --tail=120 laravel-api web mariadb
          exit 0

      - name: Upload Allure results (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          retention-days: 14

      - name: Upload plain test report (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: build/reports/tests/test
          retention-days: 14
