name: CI

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # peaceiris/actions-gh-pages pushes the report to gh-pages with GITHUB_TOKEN.
      contents: write
    concurrency:
      # Two runs publishing at once would force-push over each other and lose a report.
      group: allure-gh-pages
      cancel-in-progress: false
    env:
      # docker-compose.prod.yml uses PREBUILT images, so there is no "composer" service and
      # no ~10 minute source install for the readiness gates to race against.
      # The CI override rebuilds only "web": its published image has no linux/amd64 variant
      # and dies with "exec format error" on a GitHub runner. It is just nginx.
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.ci.yml

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The public demo site sits behind Cloudflare, which blocks GitHub runner IP ranges,
      # so the tests run against a self-hosted copy of the application instead.
      - name: Check out application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: app-under-test

      - name: Start application under test
        working-directory: app-under-test
        run: |
          printf 'SPRINT=sprint5\nDISABLE_LOGGING=false\n' > .env
          cat > docker-compose.ci.yml <<'OVERRIDE'
          services:
            web:
              build:
                context: ./_docker
                dockerfile: web.docker
              image: pst-web-ci:local
          OVERRIDE
          docker compose build web
          docker compose up -d
          # Its invoice job crashes on an empty DB and only adds noise.
          docker compose stop cron || true

      - name: Prepare the database
        working-directory: app-under-test
        run: |
          # migrate:fresh boots the whole framework, so this doubles as the "is Laravel up?"
          # gate. The retries cover MariaDB still starting.
          API=$(docker compose ps -q laravel-api)
          for i in $(seq 1 30); do
            if docker exec "$API" php artisan migrate:fresh --seed --force; then
              echo "Database migrated and seeded."
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Wait for the app to serve
        run: |
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/brands || echo 000)
            ui=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 || echo 000)
            echo "attempt $i: api=$api ui=$ui"
            if [ "$api" = "200" ] && [ "$ui" = "200" ]; then
              echo "Application is serving."
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:4200/
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FIRSTNAME: ${{ secrets.TEST_USER_FIRSTNAME }}
          TEST_USER_LASTNAME: ${{ secrets.TEST_USER_LASTNAME }}
          TEST_USER_STREET: ${{ secrets.TEST_USER_STREET }}
          TEST_USER_CITY: ${{ secrets.TEST_USER_CITY }}
          TEST_USER_COUNTRY: ${{ secrets.TEST_USER_COUNTRY }}
        run: ./gradlew clean test -PincludeTags=smoke --stacktrace

      # ---- Publish the Allure report to GitHub Pages, keeping past runs so the trend,
      # ---- retry and duration graphs have history to draw. ----
      - name: Check there are Allure results to publish
        if: always()
        id: allure_check
        run: |
          # Guard. Publishing an EMPTY folder does not merely fail: peaceiris would commit the
          # deletion of every file on gh-pages and wipe the accumulated history. So if the test
          # step was skipped or produced nothing, skip publishing entirely and keep what is there.
          if [ -n "$(ls -A build/allure-results 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results found - skipping publish to protect the existing report."
          fi

      - name: Load previous Allure history
        if: always() && steps.allure_check.outputs.found == 'true'
        continue-on-error: true   # no gh-pages branch yet on the very first run
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Drop the history checkout's .git
        if: always() && steps.allure_check.outputs.found == 'true'
        run: |
          # actions/checkout creates gh-pages/.git BEFORE it fetches, so a failed checkout (no
          # branch yet) still leaves a stub repo whose HEAD points at refs/heads/master.
          # The Allure action then runs "cp -r ./gh-pages/. ./allure-history" - dotfiles
          # included - as root, and peaceiris cannot delete the root-owned copy (EACCES). It
          # copies that stub over its own .git, HEAD reverts to master, the commit lands on
          # master and "git push origin gh-pages" fails with "src refspec does not match any".
          # Deleting it here, while it is still runner-owned, breaks that chain.
          rm -rf gh-pages/.git

      - name: Build Allure report
        if: always() && steps.allure_check.outputs.found == 'true'
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: build/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 60        # browsable past runs kept on the branch

      - name: Publish Allure report to GitHub Pages
        if: always() && steps.allure_check.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Dump app diagnostics on failure
        if: failure()
        working-directory: app-under-test
        run: |
          set +e
          docker compose ps
          echo "== GET :8091/brands =="
          curl -s -i http://localhost:8091/brands | head -n 30
          echo "== laravel.log =="
          docker exec "$(docker compose ps -q laravel-api)" \
            sh -c 'tail -n 150 storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"'
          echo "== container logs =="
          docker compose logs --tail=120 laravel-api web mariadb angular-ui
          exit 0

      - name: Upload Allure results (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          retention-days: 30

      - name: Upload plain test report (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: build/reports/tests/test
          retention-days: 14
