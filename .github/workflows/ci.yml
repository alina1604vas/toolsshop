name: CI

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---- Stand up the application under test locally, so tests do not hit the
      # ---- public demo site (which is behind Cloudflare and blocks CI IPs). ----
      - name: Check out application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: app-under-test

      - name: Start application under test (Docker)
        working-directory: app-under-test
        run: |
          if [ -f .env.example ]; then cp -n .env.example .env || true; fi
          docker compose up -d

      - name: Fix API .env for Docker (DB host + disable queue) and clear caches
        working-directory: app-under-test
        run: |
          # The app's committed .env has DB_HOST=127.0.0.1, which inside the laravel-api
          # container points at itself, not at the separate "mariadb" container. If a config
          # cache bakes that in, every DB query fails at the PHP level (empty 500, no Laravel
          # log). Also switch the queue to "null" so the buggy CreateInvoicePDF job is never
          # queued/processed. Then clear all caches so the app reads the corrected values.
          API=$(docker compose ps -q laravel-api)
          # wait until the container's php is up enough to run artisan (composer install may still run)
          for i in $(seq 1 60); do
            if docker exec "$API" php -v >/dev/null 2>&1; then break; fi
            echo "waiting for php in laravel-api... $i"; sleep 5
          done
          docker exec "$API" sh -c "sed -i 's/^DB_HOST=.*/DB_HOST=mariadb/' .env && sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=null/' .env"
          echo "== effective .env DB/queue after fix =="
          docker exec "$API" sh -c 'grep -aE "^(DB_HOST|QUEUE_CONNECTION)=" .env'
          docker exec "$API" php artisan optimize:clear || true
          docker compose restart laravel-api web || true

      - name: Wait for the API backend to serve HTTP 200
        run: |
          # Waits until the API actually answers over HTTP (not just until the container is up).
          # This also waits out "composer install" - until vendor/ is complete the app 500s.
          echo "Waiting for the API to serve HTTP 200 on /brands ..."
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/brands || echo 000)
            echo "attempt $i: GET :8091/brands -> $code"
            if [ "$code" = "200" ]; then
              echo "API is serving."
              exit 0
            fi
            sleep 10
          done
          echo "API did not start serving in time. Diagnostics:"
          (cd app-under-test && docker compose ps && docker compose logs --tail=150)
          exit 1

      - name: Prepare the database (non-destructive, seed only if empty)
        working-directory: app-under-test
        run: |
          API=$(docker compose ps -q laravel-api)
          # If the API already serves seeded data, leave it completely alone.
          if curl -s http://localhost:8091/brands | grep -q "{"; then
            echo "API already serves seeded data - nothing to do."
            exit 0
          fi
          echo "No data yet - running NON-destructive migrate + seed (never migrate:fresh,"
          echo "because dropping tables collides with the running cron/queue worker)."
          docker exec "$API" php artisan migrate --force || true
          for i in $(seq 1 5); do
            if docker exec "$API" php artisan db:seed --force; then
              echo "Seeding done."
              exit 0
            fi
            echo "Seed attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Seeding failed. Laravel log (excluding invoice-PDF queue noise):"
          docker exec "$API" sh -c 'grep -a -v -i invoice storage/logs/laravel.log 2>/dev/null | tail -n 120 || echo "(no laravel.log)"'
          exit 1

      - name: Stop cron and restart the app for a clean, stable state
        working-directory: app-under-test
        run: |
          # The cron service runs the Laravel scheduler + a queue worker that keeps crashing on
          # the CreateInvoicePDF / invoice.blade.php bug. Left running, it eventually wedges the
          # API into permanent 500s (exhausted DB connections). Stop cron, then restart the app
          # process so it comes up clean against the already-seeded database (mariadb is a
          # separate container and is NOT restarted, so the seeded data is preserved).
          docker compose stop cron || true
          docker compose restart laravel-api web || true
          echo "Waiting for the API to serve HTTP 200 again after restart..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/brands || echo 000)
            echo "post-restart attempt $i: GET :8091/brands -> $code"
            if [ "$code" = "200" ]; then
              echo "API healthy after restart."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::API did not stay healthy after restart (known invoice/queue self-wedge)."
          echo "::warning::Smoke tests do not depend on it, so continuing."
          exit 0

      - name: Verify the API serves seeded data
        run: |
          # Require the endpoints the UI actually reads to return data *consistently*
          # (several passes in a row), so we do not start tests during an unstable window.
          ok=0
          for i in $(seq 1 24); do
            brands=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/brands || echo 000)
            products=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/products || echo 000)
            cats=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/categories/tree || echo 000)
            echo "attempt $i: /brands=$brands /products=$products /categories/tree=$cats"
            if [ "$brands" = "200" ] && [ "$products" = "200" ] && [ "$cats" = "200" ]; then
              ok=$((ok+1))
              echo "  all endpoints 200 ($ok consecutive)"
              if [ "$ok" -ge 3 ]; then
                echo "API is serving catalogue data consistently."
                exit 0
              fi
            else
              ok=0
            fi
            sleep 5
          done
          echo "::warning::The product API never stabilised (the app self-wedges on its"
          echo "::warning::built-in invoice/queue bug). Smoke tests (HeaderTest) do not read the"
          echo "::warning::product API, so continuing anyway. Re-enable a hard check here once the"
          echo "::warning::backend is made stable for API-dependent tests."
          exit 0

      - name: Diagnose the API 500 (real cause)
        if: always()
        working-directory: app-under-test
        run: |
          set +e
          API=$(docker compose ps -q laravel-api)
          echo "===================== FULL 500 BODY (/brands) ====================="
          curl -s http://localhost:8091/brands | head -c 6000; echo
          echo "===================== FULL 500 BODY (/products) ==================="
          curl -s http://localhost:8091/products | head -c 3000; echo
          echo "===================== app .env (DB / debug / queue) ==============="
          docker exec "$API" sh -c 'grep -aE "^(DB_|APP_DEBUG|APP_ENV|QUEUE_|LOG_)" .env 2>/dev/null'
          echo "===================== storage/logs ================================"
          docker exec "$API" sh -c 'ls -la storage/logs/ 2>/dev/null; echo ----; cat storage/logs/*.log 2>/dev/null | tail -n 200 || echo "(no *.log)"'
          echo "===================== docker logs: laravel-api ===================="
          docker compose logs --tail=60 laravel-api
          echo "===================== processes: laravel-api ======================"
          docker exec "$API" sh -c 'ps -ef 2>/dev/null || ps aux 2>/dev/null' | head -50
          echo "===================== processes: cron (if any) ===================="
          CRON=$(docker compose ps -q cron); if [ -n "$CRON" ]; then docker exec "$CRON" sh -c 'ps -ef 2>/dev/null || ps aux' | head -50; else echo "(cron container not running)"; fi
          echo "===================== MariaDB connection state ===================="
          DBUSER=$(docker exec "$API" sh -c 'grep -aE "^DB_USERNAME" .env | head -1 | cut -d= -f2' | tr -d "\r\"'"'"'")
          DBPASS=$(docker exec "$API" sh -c 'grep -aE "^DB_PASSWORD" .env | head -1 | cut -d= -f2' | tr -d "\r\"'"'"'")
          echo "DB_USERNAME=$DBUSER"
          docker compose exec -T mariadb sh -c "mysql -u\"$DBUSER\" -p\"$DBPASS\" -e 'SHOW VARIABLES LIKE \"max_connections\"; SHOW STATUS LIKE \"Threads_connected\"; SHOW STATUS LIKE \"Max_used_connections\"; SHOW STATUS LIKE \"Aborted_connects\";'" 2>&1 | head -40
          echo "===================== MariaDB processlist ========================="
          docker compose exec -T mariadb sh -c "mysql -u\"$DBUSER\" -p\"$DBPASS\" -e 'SHOW FULL PROCESSLIST;'" 2>&1 | head -60
          echo "===================== jobs / failed_jobs counts =================="
          docker compose exec -T mariadb sh -c "mysql -u\"$DBUSER\" -p\"$DBPASS\" toolshop -e 'SELECT COUNT(*) AS jobs FROM jobs; SELECT COUNT(*) AS failed FROM failed_jobs;'" 2>&1 | head -20
          echo "===================== end diagnostics ============================="
          exit 0

      - name: Wait for UI to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4200; then
              echo "UI is up at http://localhost:4200"
              exit 0
            fi
            echo "Waiting for UI to be ready... attempt $i"
            sleep 10
          done
          echo "UI did not become ready in time."
          (cd app-under-test && docker compose logs --tail=80 angular-ui)
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:4200/
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_FIRSTNAME: ${{ secrets.TEST_USER_FIRSTNAME }}
          TEST_USER_LASTNAME: ${{ secrets.TEST_USER_LASTNAME }}
          TEST_USER_STREET: ${{ secrets.TEST_USER_STREET }}
          TEST_USER_CITY: ${{ secrets.TEST_USER_CITY }}
          TEST_USER_COUNTRY: ${{ secrets.TEST_USER_COUNTRY }}
        run: ./gradlew clean test -PincludeTags=smoke -Dheadless=true --stacktrace

      - name: Dump app logs on failure
        if: failure()
        working-directory: app-under-test
        run: docker compose logs --tail=120

      - name: Upload Allure results (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          retention-days: 14

      - name: Upload plain test report (even if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: build/reports/tests/test
          retention-days: 14
